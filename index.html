<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>駅の都会度クイズ</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1c2733;--mut:#5f6c7b;--pri:#1565c0;--ok:#2e7d32;--ng:#c62828;--bd:#d5dbe1}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a222b;--fg:#e8edf2;--mut:#9aa7b4;--pri:#64a8f0;--ok:#66bb6a;--ng:#ef6a6a;--bd:#33414f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.85rem}
button{font:inherit;color:inherit}
.mode{width:100%;text-align:left;padding:14px;margin-bottom:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}
.mode b{display:block}
.primary{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;cursor:pointer;font-weight:600}
.primary[disabled]{opacity:.5}
.sta{font-size:1.8rem;font-weight:700;margin:.1em 0}
.links{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.links a{color:var(--pri);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{min-height:48px;height:auto;white-space:normal;word-break:keep-all;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;text-align:center}
.grid button[disabled]{cursor:default}
.grid .correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}
.grid .wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 22%,transparent)}
.fb{margin:12px 0;font-weight:600}
.ok{color:var(--ok)}.ng{color:var(--ng)}
textarea{width:100%;min-height:150px;font:inherit;font-size:.9rem;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.big{font-size:2.4rem;font-weight:800;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<main>
<h1>🚉 駅の都会度クイズ</h1>
<div id="app"></div>
<p class="mut" style="margin-top:16px">出典：国土数値情報（駅別乗降客数データ）（国土交通省）を加工して作成。駅の路線・所在地はWikidata（CC0）。ランクは確定基準駅を除き推定値です。</p>
</main>
<script src="stations.js"></script>
<script>
const RANKS={10:"超大都会",9:"大都会",8:"都会（上位）",7:"都会",6:"小都会（上位）",5:"小都会",4:"エセ田舎（都会寄り）",3:"エセ田舎",2:"田舎",1:"ド田舎"};
const ALL=[];
for(const [pref,rows] of Object.entries(PREFECTURE_STATIONS))
  for(const [name,line,rank,status,note] of rows) ALL.push({name,line,rank,status,note,pref});

const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 探索モード: 確定基準駅を除外。境界(ランク3〜7)に近いほど出やすい重み付きサンプリング（重複なし）
function pickExplore(n){
  let pool=ALL.filter(s=>s.status!=='calibrated');
  if(pool.length<n) pool=pool.concat(shuffle(ALL.filter(s=>s.status==='calibrated')));
  const out=[];pool=pool.slice();
  while(out.length<n&&pool.length){
    const w=pool.map(s=>(s.rank>=3&&s.rank<=7?3:1)*(s.status==='unverified'?2:1));
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while((r-=w[i])>0)i++;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
function start(mode){
  S={mode,qs:mode==='explore'?pickExplore(5):shuffle(ALL).slice(0,5),i:0,score:0,log:[],answered:false};
  render();
}
function home(){
  S=null;
  const cnt=st=>ALL.filter(s=>s.status===st).length;
  $.innerHTML=`<div class="card"><p>駅の「都会度」を10段階で当てよう。5問・100点満点。<br><span class="mut">ぴったり20点／±1ランク10点。収録 ${ALL.length}駅（確定 ${cnt('calibrated')}／未検証 ${cnt('unverified')}／自動推定 ${cnt('estimated')}）</span></p>
  <button class="mode" data-m="explore"><b>🧭 未知の境界・探索5問</b><span class="mut">確定済みの基準駅を除き、未検証の境界駅を優先出題</span></button>
  <button class="mode" data-m="random"><b>🔀 全国ランダム5問</b><span class="mut">全収録駅から重複なしで出題</span></button></div>`;
  $.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function render(){
  if(!S)return home();
  if(S.i>=S.qs.length)return result();
  const q=S.qs[S.i], kw=encodeURIComponent(q.name+'駅 '+q.pref);
  let btns='';
  for(let r=10;r>=1;r--)btns+=`<button data-r="${r}">${r}：${RANKS[r]}</button>`;
  $.innerHTML=`<div class="card"><div class="mut">第${S.i+1}問 / ${S.qs.length}　現在 ${S.score}点</div>
  <div class="sta">${esc(q.name)}駅</div><div class="mut">${esc(q.pref)}・${esc(q.line)}</div>
  <div class="links"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${kw}">🗺️ Googleマップで駅前を見る（航空写真・地図で駅裏確認用）</a>
  <a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${kw}">📷 駅前の写真を見る（画像検索）</a></div>
  <div class="grid">${btns}</div><div id="fb"></div></div>`;
  $.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>answer(+b.dataset.r));
}
function answer(r){
  if(S.answered)return;S.answered=true;
  const q=S.qs[S.i],d=Math.abs(r-q.rank),pt=d===0?20:d===1?10:0;
  S.score+=pt;S.log.push({q,r,pt});
  $.querySelectorAll('.grid button').forEach(b=>{b.disabled=true;const v=+b.dataset.r;
    if(v===q.rank)b.classList.add('correct');else if(v===r)b.classList.add('wrong')});
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${pt?'ok':'ng'}">${d===0?'⭕ 正解':'あなた '+r+' / 基準 '+q.rank}（+${pt}点）</div>
  <div class="mut">基準ランク：${q.rank}（${RANKS[q.rank]}）／${q.status==='calibrated'?'確定基準駅':q.status==='unverified'?'未検証（手動推定）':'自動推定（精度低・参考値）'}</div>${q.note?`<div class="mut">📝 ${esc(q.note)}</div>`:''}
  <button class="primary" id="nx" style="margin-top:10px">${last?'結果を見る':'次の問題へ'}</button>`;
  document.getElementById('nx').onclick=()=>{S.i++;S.answered=false;render()};
}
function resultText(){
  const m=S.mode==='explore'?'未知の境界・探索':'全国ランダム';
  return `🚉 駅の都会度クイズ（${m}）\n結果：${S.score}/100点\n`+S.log.map((l,i)=>`${i+1}. ${l.q.name}駅(${l.q.pref}) 基準${l.q.rank}／回答${l.r} ${l.pt?(l.pt===20?'⭕':'△'):'❌'}`).join('\n');
}
function result(){
  const t=resultText();
  $.innerHTML=`<div class="card"><div class="big">${S.score}<span class="mut"> / 100</span></div>
  <textarea id="ta" readonly>${esc(t)}</textarea>
  <div class="row" style="margin-top:8px"><button class="primary" id="cp">📋 結果をコピー</button><button class="primary" id="re">もう一度</button></div>
  <div class="mut" id="cm" style="margin-top:6px">コピーできない場合は上の枠を長押し／全選択してください。</div></div>`;
  const ta=document.getElementById('ta');
  ta.onfocus=()=>ta.select();
  document.getElementById('re').onclick=home;
  document.getElementById('cp').onclick=async()=>{
    const msg=document.getElementById('cm');
    try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);msg.textContent='✅ コピーしました';return} }catch(e){}
    try{ ta.focus();ta.select();ta.setSelectionRange(0,t.length);
      msg.textContent=document.execCommand('copy')?'✅ コピーしました':'⚠️ 自動コピー不可：枠内を長押ししてコピーしてください';
    }catch(e){msg.textContent='⚠️ 自動コピー不可：枠内を長押ししてコピーしてください'}
  };
}
home();
</script>
</body>
</html>
